<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Tech Reticle Frame -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="16 12" opacity="0.4" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#34d399" stroke-width="2" opacity="0.6" />

  <!-- Corner Brackets -->
  <path d="M 120 170 L 120 120 L 170 120" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <path d="M 392 170 L 392 120 L 342 120" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <path d="M 120 342 L 120 392 L 170 392" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <path d="M 392 342 L 392 392 L 342 392" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" />

  <!-- Center Biometric Crescent & Star + Ballot Box -->
  <!-- Pakistani Crescent -->
  <path d="M 275 160 A 90 90 0 1 0 325 315 A 72 72 0 1 1 275 160 Z" fill="#ffffff" opacity="0.95" />
  
  <!-- Star -->
  <polygon points="315,190 322,210 342,210 326,222 332,242 315,230 298,242 304,222 288,210 308,210" fill="url(#goldGrad)" />

  <!-- Voting Checkmark Hologram -->
  <path d="M 190 270 L 235 315 L 340 195" fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
